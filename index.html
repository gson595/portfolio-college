        function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
        function loadData(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
        function generateId(arr) { return arr.length > 0 ? Math.max(...arr.map(i => i.id)) + 1 : 1; }
        function getInitials(f, l) { return (f?.[0] || '') + (l?.[0] || ''); }
        function formatDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('ru-RU'); }
        function formatDateTime(d) { if (!d) return '—'; return new Date(d).toLocaleString('ru-RU'); }
        function formatTimeAgo(d) {
            const diff = Math.floor((new Date() - new Date(d)) / 1000);
            if (diff < 60) return 'только что';
            if (diff < 3600) return `${Math.floor(diff / 60)} мин. назад`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} ч. назад`;
            if (diff < 604800) return `${Math.floor(diff / 86400)} дн. назад`;
            return formatDate(d);
        }
        function getUserPoints(userId) {
            return loadData(STORAGE.ACHIEVEMENTS).filter(a => a.userId === userId).reduce((s, a) => s + (a.points || 0), 0);
        }

        function showToast(message, type = 'success', title = null) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'fa-check', error: 'fa-times', warning: 'fa-exclamation', info: 'fa-info' };
            const titles = { success: 'Успешно', error: 'Ошибка', warning: 'Внимание', info: 'Информация' };
            toast.innerHTML = `
                <div class="toast-icon"><i class="fas ${icons[type]}"></i></div>
                <div class="toast-content">
                    <div class="toast-title">${title || titles[type]}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 4000);
        }

        function switchAuthTab(tab) {
            document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
            document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
        }

        function selectRole(role, el) {
            document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('regRole').value = role;
            document.querySelectorAll('.role-fields').forEach(f => f.classList.remove('active'));
            const fields = document.getElementById(role + 'RegFields');
            if (fields) fields.classList.add('active');
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;
            const users = loadData(STORAGE.USERS);
            const user = users.find(u => u.email === email && u.password === password && u.role === role);
            if (user) {
                state.currentUser = user;
                localStorage.setItem(STORAGE.CURRENT_USER, JSON.stringify(user));
                showMainApp();
                showToast(`Добро пожаловать, ${user.firstName}!`);
            } else {
                showToast('Неверные данные для входа', 'error');
            }
            return false;
        }

        function handleRegister(e) {
            e.preventDefault();
            const role = document.getElementById('regRole').value;
            const lastName = document.getElementById('regLastName').value.trim();
            const firstName = document.getElementById('regFirstName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            if (!lastName || !firstName || !email || !password) {
                showToast('Заполните все обязательные поля', 'error');
                return false;
            }
            const users = loadData(STORAGE.USERS);
            if (users.find(u => u.email === email)) {
                showToast('Email уже зарегистрирован', 'error');
                return false;
            }
            const newUser = {
                id: generateId(users), email, password, role, firstName, lastName,
                middleName: document.getElementById('regMiddleName').value.trim(),
                birthDate: document.getElementById('regBirthDate').value,
                points: 0, createdAt: new Date().toISOString()
            };
            if (role === 'student') {
                newUser.group = document.getElementById('regGroup').value;
            } else if (role === 'teacher') {
                const code = document.getElementById('regTeacherCode').value;
                if (code !== CONFIG.TEACHER_CODE) {
                    showToast('Неверный код преподавателя', 'error');
                    return false;
                }
                newUser.department = document.getElementById('regDepartment').value;
                newUser.position = document.getElementById('regPosition').value;
            } else if (role === 'admin') {
                const code = document.getElementById('regAdminCode').value;
                if (code !== CONFIG.ADMIN_CODE) {
                    showToast('Неверный код администратора', 'error');
                    return false;
                }
                newUser.department = document.getElementById('regAdminDept').value;
                newUser.accessLevel = document.getElementById('regAccessLevel').value;
            }
            users.push(newUser);
            saveData(STORAGE.USERS, users);
            showToast('Регистрация успешна!');
            document.querySelector('.login-tab').click();
            return false;
        }

        function logout() {
            state.currentUser = null;
            localStorage.removeItem(STORAGE.CURRENT_USER);
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            showToast('Вы вышли из системы', 'info');
        }

        function showMainApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            applyTheme();
            applyAccent();
            updateUserInfo();
            renderNavigation();
            showSection('dashboard');
            renderNotifications();
        }

        function applyTheme() {
            document.documentElement.setAttribute('data-theme', state.theme);
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = state.theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }

        function applyAccent() {
            document.documentElement.setAttribute('data-accent', state.accent);
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem(STORAGE.THEME, state.theme);
            applyTheme();
        }

        function setAccent(color) {
            state.accent = color;
            localStorage.setItem(STORAGE.ACCENT, color);
            applyAccent();
        }

        function updateUserInfo() {
            const user = state.currentUser;
            if (!user) return;
            document.getElementById('sidebarAvatar').textContent = getInitials(user.firstName, user.lastName);
            document.getElementById('sidebarUserName').textContent = `${user.firstName} ${user.lastName}`;
            const roles = { student: 'Студент', teacher: 'Преподаватель', admin: 'Администратор' };
            document.getElementById('sidebarUserRole').textContent = roles[user.role];
        }

        function getUnreadCount() {
            return loadData(STORAGE.MESSAGES).filter(m => m.receiverId === state.currentUser?.id && !m.read).length;
        }

        function renderNavigation() {
            const nav = document.getElementById('sidebarNav');
            const user = state.currentUser;
            const unread = getUnreadCount();
            let html = `<div class="nav-section"><div class="nav-section-title">Основное</div>

                <div class="nav-item" onclick="showSection('profile', this)"><i class="fas fa-user"></i><span>Профиль</span></div>`;
            
            if (user.role === 'student') {
                html += `<div class="nav-item" onclick="showSection('achievements', this)"><i class="fas fa-trophy"></i><span>Достижения</span></div>
                    <div class="nav-item" onclick="showSection('projects', this)"><i class="fas fa-project-diagram"></i><span>Проекты</span></div>

                </div><div class="nav-section"><div class="nav-section-title">Дневник</div>
                    <div class="nav-item" onclick="showSection('diary', this)"><i class="fas fa-book"></i><span>Мой дневник</span></div>
                    <div class="nav-item" onclick="showSection('schedule', this)"><i class="fas fa-calendar-alt"></i><span>Расписание</span></div>
                </div><div class="nav-section"><div class="nav-section-title">Сообщество</div>
                    <div class="nav-item" onclick="showSection('reviews', this)"><i class="fas fa-comments"></i><span>Рецензии</span></div>
                    <div class="nav-item" onclick="showSection('rating', this)"><i class="fas fa-chart-line"></i><span>Рейтинг</span></div>
                    <div class="nav-item" onclick="showSection('messages', this)"><i class="fas fa-envelope"></i><span>Сообщения</span>${unread > 0 ? `<span class="badge">${unread}</span>` : ''}</div>`;
            } else if (user.role === 'teacher') {
                html += `<div class="nav-item" onclick="showSection('students', this)"><i class="fas fa-user-graduate"></i><span>Студенты</span></div>
                    <div class="nav-item" onclick="showSection('reviews', this)"><i class="fas fa-comments"></i><span>Рецензии</span></div>
                </div><div class="nav-section"><div class="nav-section-title">Аналитика</div>
                    <div class="nav-item" onclick="showSection('rating', this)"><i class="fas fa-chart-line"></i><span>Рейтинг</span></div>
                    <div class="nav-item" onclick="showSection('analytics', this)"><i class="fas fa-chart-bar"></i><span>Статистика</span></div>
                </div><div class="nav-section"><div class="nav-section-title">Коммуникации</div>
                    <div class="nav-item" onclick="showSection('messages', this)"><i class="fas fa-envelope"></i><span>Сообщения</span>${unread > 0 ? `<span class="badge">${unread}</span>` : ''}</div>`;
            } else if (user.role === 'admin') {
                html += `</div><div class="nav-section"><div class="nav-section-title">Управление</div>
                    <div class="nav-item" onclick="showSection('students', this)"><i class="fas fa-user-graduate"></i><span>Студенты</span></div>
                    <div class="nav-item" onclick="showSection('users', this)"><i class="fas fa-users-cog"></i><span>Пользователи</span></div>

                </div><div class="nav-section"><div class="nav-section-title">Аналитика</div>
                    <div class="nav-item" onclick="showSection('analytics', this)"><i class="fas fa-chart-bar"></i><span>Статистика</span></div>
                    <div class="nav-item" onclick="showSection('rating', this)"><i class="fas fa-chart-line"></i><span>Рейтинг</span></div>
                </div><div class="nav-section"><div class="nav-section-title">Система</div>
                    <div class="nav-item" onclick="showSection('files', this)"><i class="fas fa-folder"></i><span>Файлы</span></div>
                    <div class="nav-item" onclick="showSection('messages', this)"><i class="fas fa-envelope"></i><span>Сообщения</span>${unread > 0 ? `<span class="badge">${unread}</span>` : ''}</div>`;
            }
            html += '</div>';
            nav.innerHTML = html;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function showSection(section, navItem = null) {
            state.currentSection = section;
            if (navItem) {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                navItem.classList.add('active');
            }
            const titles = { dashboard: 'Главная', profile: 'Профиль', achievements: 'Достижения', projects: 'Проекты', certificates: 'Сертификаты', goals: 'Цели', diary: 'Дневник', schedule: 'Расписание', reviews: 'Рецензии', rating: 'Рейтинг', messages: 'Сообщения', students: 'Студенты', users: 'Пользователи', groups: 'Группы', analytics: 'Аналитика', files: 'Файлы' };
            document.getElementById('pageTitle').textContent = titles[section] || section;
            document.getElementById('pageBreadcrumb').textContent = titles[section] || section;
            
            const content = document.getElementById('mainContent');
            const renderers = {
                dashboard: renderDashboard, profile: renderProfile, achievements: renderAchievements,
                projects: renderProjects, certificates: renderCertificates, goals: renderGoals,
                diary: renderDiary, schedule: renderSchedule, reviews: renderReviews,
                rating: renderRating, messages: renderMessages, students: renderStudents,
                users: renderUsers, groups: renderGroups, analytics: renderAnalytics, files: renderFiles
            };
            if (renderers[section]) renderers[section](content);
            else content.innerHTML = '<div class="card"><p>Раздел в разработке</p></div>';
            
            if (window.innerWidth <= 1024) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('overlay').classList.remove('active');
            }
        }

        function renderDashboard(c) {
            const user = state.currentUser;
            const achievements = loadData(STORAGE.ACHIEVEMENTS);
            const projects = loadData(STORAGE.PROJECTS);
            const users = loadData(STORAGE.USERS);
            const ua = achievements.filter(a => a.userId === user.id);
            const up = projects.filter(p => p.userId === user.id);
            const points = getUserPoints(user.id);
            const notifications = loadData(STORAGE.NOTIFICATIONS).filter(n => n.userId === user.id && !n.read).length;

            c.innerHTML = `
                <div class="stats-grid">

        function renderMessages(c) {
            const messages = loadData(STORAGE.MESSAGES);
            const users = loadData(STORAGE.USERS);
            const user = state.currentUser;
            const convs = {};
            messages.forEach(m => {
                const otherId = m.senderId === user.id ? m.receiverId : m.senderId;
                if (!convs[otherId]) convs[otherId] = [];
                convs[otherId].push(m);
            });
            const convList = Object.entries(convs).map(([otherId, msgs]) => {
                const otherUser = users.find(u => u.id === parseInt(otherId));
                const lastMsg = msgs[msgs.length - 1];
                const unread = msgs.filter(m => m.receiverId === user.id && !m.read).length;
                return { otherId: parseInt(otherId), otherUser, lastMsg, unread, messages: msgs };
            }).filter(c => c.otherUser);

            c.innerHTML = `
                <div class="messages-container">
                    <div class="messages-list">
                        <div class="messages-list-header"><input type="text" placeholder="Поиск..."></div>
                        <div class="messages-list-content">
                            ${convList.length ? convList.map(cv => `
                                <div class="message-preview ${cv.unread ? 'unread' : ''} ${state.currentConversation === cv.otherId ? 'active' : ''}" onclick="openConv(${cv.otherId})">
                                    <div class="message-avatar">${getInitials(cv.otherUser.firstName, cv.otherUser.lastName)}</div>
                                    <div class="message-info"><h5>${cv.otherUser.lastName} ${cv.otherUser.firstName}</h5><p>${cv.lastMsg.text.substring(0, 30)}...</p></div>
                                    <span class="message-time">${formatTimeAgo(cv.lastMsg.date)}</span>
                                </div>
                            `).join('') : '<p style="padding: 20px; text-align: center; color: var(--text-muted);">Нет сообщений</p>'}
                        </div>
                    </div>
                    <div class="messages-chat">
                        <div class="chat-header" id="chatHeader"><p style="color: var(--text-muted);">Выберите диалог</p></div>
                        <div class="chat-messages" id="chatMessages"><div class="chat-empty">Выберите диалог для просмотра</div></div>
                        <div class="chat-input"><input type="text" placeholder="Сообщение..." id="msgInput" onkeypress="if(event.key==='Enter')sendMsg()" disabled><button class="btn btn-primary" onclick="sendMsg()" id="sendMsgBtn" disabled><i class="fas fa-paper-plane"></i></button></div>
                    </div>
                </div>
            `;
        }

        function openConv(otherId) {
            state.currentConversation = otherId;
            const messages = loadData(STORAGE.MESSAGES);
            const users = loadData(STORAGE.USERS);
            const user = state.currentUser;
            const otherUser = users.find(u => u.id === otherId);
            if (!otherUser) return;

            // Mark as read
            let updated = false;
            messages.forEach(m => {
                if (m.senderId === otherId && m.receiverId === user.id && !m.read) {
                    m.read = true;
                    updated = true;
                }
            });
            if (updated) {
                saveData(STORAGE.MESSAGES, messages);
                renderNavigation();
            }

            const convMsgs = messages.filter(m => (m.senderId === user.id && m.receiverId === otherId) || (m.senderId === otherId && m.receiverId === user.id)).sort((a, b) => new Date(a.date) - new Date(b.date));

            document.getElementById('chatHeader').innerHTML = `<div class="message-avatar">${getInitials(otherUser.firstName, otherUser.lastName)}</div><div><h5 style="font-size: 14px;">${otherUser.lastName} ${otherUser.firstName}</h5><p style="font-size: 12px; color: var(--text-muted);">${otherUser.role === 'teacher' ? 'Преподаватель' : otherUser.role === 'admin' ? 'Администратор' : 'Студент'}</p></div>`;
            document.getElementById('chatMessages').innerHTML = convMsgs.map(m => `<div class="chat-message ${m.senderId === user.id ? 'sent' : 'received'}"><div>${m.text}</div><div class="chat-message-time">${formatTimeAgo(m.date)}</div></div>`).join('');
            document.getElementById('msgInput').disabled = false;
            document.getElementById('sendMsgBtn').disabled = false;

            document.querySelectorAll('.message-preview').forEach(el => el.classList.remove('active'));
            event.currentTarget?.classList.add('active');
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !state.currentConversation) return;
            const messages = loadData(STORAGE.MESSAGES);
            messages.push({
                id: generateId(messages),
                senderId: state.currentUser.id,
                receiverId: state.currentConversation,
                text,
                read: false,
                date: new Date().toISOString()
            });
            saveData(STORAGE.MESSAGES, messages);
            input.value = '';
            openConv(state.currentConversation);
        }

        function viewFile(id) {
            const file = loadData(STORAGE.FILES).find(f => f.id === id);

            openModal(file.name + '.txt', `

        function downloadFile(id) {
            const file = loadData(STORAGE.FILES).find(f => f.id === id);
            if (!file) return;
            const blob = new Blob([file.content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = file.name + '.txt';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Файл скачан');
        }

            openModal('Настройки', `
                <div class="settings-container">
                    <div class="settings-sidebar">
                        <div class="settings-nav-item active" onclick="showSettingsSection('appearance', this)"><i class="fas fa-palette"></i> Внешний вид</div>
                        <div class="settings-nav-item" onclick="showSettingsSection('account', this)"><i class="fas fa-user"></i> Аккаунт</div>
                        <div class="settings-nav-item" onclick="showSettingsSection('about', this)"><i class="fas fa-info-circle"></i> О системе</div>
                    </div>
                    <div class="settings-content">
                        <div id="settingsAppearance" class="settings-section active">
                            <h3>Внешний вид</h3>
                            <p>Настройте интерфейс под себя</p>
                            
                            <h4>Тема по умолчанию</h4>
                            <div class="theme-options">
                                <div class="theme-option dark ${state.theme === 'dark' ? 'active' : ''}" onclick="setTheme('dark', this)">
                                    <div class="theme-option-preview"></div>
                                    <span>Тёмная</span>
                                </div>
                                <div class="theme-option light ${state.theme === 'light' ? 'active' : ''}" onclick="setTheme('light', this)">
                                    <div class="theme-option-preview"></div>
                                    <span>Светлая</span>
                                </div>
                            </div>

                            <h4>Цветовая тема</h4>
                            <div class="color-options">
                                <div class="color-option ${state.accent === 'purple' ? 'active' : ''}" data-color="purple" onclick="setAccentColor('purple', this)"><div class="color-swatch"></div><span>Фиолетовый</span></div>
                                <div class="color-option ${state.accent === 'blue' ? 'active' : ''}" data-color="blue" onclick="setAccentColor('blue', this)"><div class="color-swatch"></div><span>Синий</span></div>
                                <div class="color-option ${state.accent === 'green' ? 'active' : ''}" data-color="green" onclick="setAccentColor('green', this)"><div class="color-swatch"></div><span>Зелёный</span></div>
                                <div class="color-option ${state.accent === 'pink' ? 'active' : ''}" data-color="pink" onclick="setAccentColor('pink', this)"><div class="color-swatch"></div><span>Розовый</span></div>
                                <div class="color-option ${state.accent === 'orange' ? 'active' : ''}" data-color="orange" onclick="setAccentColor('orange', this)"><div class="color-swatch"></div><span>Оранжевый</span></div>
                                <div class="color-option ${state.accent === 'red' ? 'active' : ''}" data-color="red" onclick="setAccentColor('red', this)"><div class="color-swatch"></div><span>Красный</span></div>
                                <div class="color-option ${state.accent === 'cyan' ? 'active' : ''}" data-color="cyan" onclick="setAccentColor('cyan', this)"><div class="color-swatch"></div><span>Бирюзовый</span></div>
                                <div class="color-option ${state.accent === 'yellow' ? 'active' : ''}" data-color="yellow" onclick="setAccentColor('yellow', this)"><div class="color-swatch"></div><span>Жёлтый</span></div>
                            </div>
                        </div>
                        <div id="settingsAccount" class="settings-section">
                            <h3>Аккаунт</h3>
                            <p>Управление учётной записью</p>
                            <div style="margin-top: 20px;">
                                <p><strong>Email:</strong> ${state.currentUser.email}</p>
                                <p><strong>Роль:</strong> ${{ student: 'Студент', teacher: 'Преподаватель', admin: 'Администратор' }[state.currentUser.role]}</p>
                                <p><strong>Дата регистрации:</strong> ${formatDate(state.currentUser.createdAt)}</p>
                            </div>
                            <button class="btn btn-danger" style="margin-top: 20px;" onclick="if(confirm('Выйти из аккаунта?')){closeModal();logout();}"><i class="fas fa-sign-out-alt"></i> Выйти из аккаунта</button>
                        </div>
                        <div id="settingsAbout" class="settings-section">
                            <h3>О системе</h3>
                            <p>Информация о приложении</p>
                            <div class="about-info" style="margin-top: 20px;">
                                <p><strong>Название:</strong> ${CONFIG.APP_NAME}</p>
                                <p><strong>Версия:</strong> ${CONFIG.VERSION}</p>
                                <p><strong>Разработчик:</strong> ${CONFIG.AUTHOR}</p>
                                <p style="margin-top: 16px;">Дипломная работа на тему:<br><em>«Проектирование и разработка информационной системы "Электронный портфолио-дневник для колледжа"»</em></p>
                                <div class="about-version"><i class="fas fa-code"></i> Сделано с ❤️ в 2026</div>
                            </div>
                        </div>
                    </div>
                </div>
            `, 'fa-cog');
        }

        function showSettingsSection(section, el) {
            document.querySelectorAll('.settings-nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.settings-section').forEach(s => s.classList.remove('active'));
            document.getElementById('settings' + section.charAt(0).toUpperCase() + section.slice(1)).classList.add('active');
        }

        function setTheme(theme, el) {
            state.theme = theme;
            localStorage.setItem(STORAGE.THEME, theme);
            applyTheme();
            document.querySelectorAll('.theme-option').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
        }

        function setAccentColor(color, el) {
            setAccent(color);
            document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
        }

        function handleGlobalSearch(q) {
            // Simple search - could be expanded
            console.log('Search:', q);
        }

        // INIT
        document.addEventListener('DOMContentLoaded', function() {
            initData();
            applyTheme();
            applyAccent();
            const savedUser = localStorage.getItem(STORAGE.CURRENT_USER);
            if (savedUser) {
                state.currentUser = JSON.parse(savedUser);
                const users = loadData(STORAGE.USERS);
                const updated = users.find(u => u.id === state.currentUser.id);
                if (updated) {
                    state.currentUser = updated;
                    showMainApp();
                }
            }
            document.getElementById('overlay').addEventListener('click', function() {
                document.getElementById('notificationsPanel').classList.remove('active');
                document.getElementById('sidebar').classList.remove('open');
                this.classList.remove('active');
            });
        });
    </script>
</body>
</html>
